<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard | Smart Delivery</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/">🚚 Smart Delivery</a><div id="navLinks" class="nav-links"></div></div></nav><main class="container section"><h1>Admin Dashboard</h1><div class="stats" style="margin:20px 0"><div class="stat"><span>Users</span><strong id="users">0</strong></div><div class="stat"><span>Products</span><strong id="products">0</strong></div><div class="stat"><span>Orders</span><strong id="orders">0</strong></div><div class="stat"><span>Revenue</span><strong id="revenue">₹0</strong></div></div><h2>Products</h2><form id="productForm" class="card" style="margin:15px 0"><input type="hidden" id="productId"><label>Name</label><input id="productName" required><label>Description</label><textarea id="productDescription"></textarea><label>Price</label><input id="productPrice" type="number" min="0" step="0.01" required><label>Category</label><input id="productCategory" required><label>Stock</label><input id="productStock" type="number" min="0" required><label>Image URL</label><input id="productImage"><button class="btn">Save Product</button> <button type="button" class="btn secondary" onclick="resetProduct()">Clear</button></form><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="productsTable"></tbody></table></div><h2 style="margin-top:30px">Orders</h2><div class="table-wrap" style="margin-top:15px"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Delivery Partner</th></tr></thead><tbody id="ordersTable"></tbody></table></div></main><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>

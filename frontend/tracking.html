<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Track Order | Smart Delivery</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/">🚚 Smart Delivery</a><div id="navLinks" class="nav-links"></div></div></nav><main class="container section"><div id="tracking" class="card">Loading...</div></main><script src="/js/app.js"></script><script>if(requireLogin()){const id=new URLSearchParams(location.search).get('id');api('/api/orders/'+id).then(d=>{document.getElementById('tracking').innerHTML=`<h1>Order #${d.order.id}</h1><p>Status: <span class="status">${d.order.order_status}</span></p><p>Total: ${money(d.order.total_amount)}</p><p>Address: ${d.order.delivery_address}</p><hr style="margin:20px 0"><h2>Tracking</h2><div class="timeline" style="margin-top:20px">${d.tracking.map(t=>`<div class="timeline-item"><strong>${t.status}</strong><div class="muted">${new Date(t.updated_at).toLocaleString()} - ${t.location||''}</div></div>`).join('')}</div>`}).catch(e=>document.getElementById('tracking').textContent=e.message)}</script></body></html>

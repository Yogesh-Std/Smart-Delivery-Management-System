<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account | Smart Delivery</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/">🚚 Smart Delivery</a><div id="navLinks" class="nav-links"></div></div></nav><main class="container"><form class="form" id="registerForm"><h1>Create Account</h1><label>Full Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Phone</label><input id="phone" pattern="[0-9]{10}" maxlength="10" required><label>Password</label><input id="password" type="password" minlength="6" required><label>Confirm Password</label><input id="confirmPassword" type="password" minlength="6" required><p id="message" class="message"></p><button class="btn" id="registerButton">Create Account</button><p class="muted" style="margin-top:15px">Already have an account? <a href="/login.html">Login</a></p></form></main><script src="/js/app.js"></script><script src="/js/auth.js"></script></body></html>
